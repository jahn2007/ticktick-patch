name: Sync release documentation

on:
  push:
    branches: ['xposed']
    paths:
      - 'xposed/RELEASE_NOTES.md'
      - '.github/workflows/sync-release-notes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-v2.0.1
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.0.1 >/dev/null 2>&1; then
            gh release edit v2.0.1 --notes-file xposed/RELEASE_NOTES.md
          else
            echo 'Release not published yet; the publish job will attach these notes.'
          fi
