name: Build Xposed Release

on:
  push:
    branches: ['xposed']
    tags: ['v1.1']
    paths:
      - 'xposed/**'
      - '.github/workflows/build-xposed.yml'
  pull_request:
    paths:
      - 'xposed/**'
      - '.github/workflows/build-xposed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xposed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: xposed
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Test and lint release
        run: gradle --no-daemon --stacktrace :app:testReleaseUnitTest :app:lintRelease

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::All four release signing secrets are required.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ticktickpatch-release.keystore"
          test -s "$RUNNER_TEMP/ticktickpatch-release.keystore"

      - name: Build and verify signed release APK
        if: github.event_name != 'pull_request'
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/ticktickpatch-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/TickTickPatch-1.1.apk

      - name: Check unsigned PR packaging
        if: github.event_name == 'pull_request'
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: TickTickPatch-release-1.1
          path: xposed/release-apk/TickTickPatch-1.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TickTickPatch-reports-${{ github.run_number }}
          path: |
            xposed/app/build/reports/
            xposed/app/build/test-results/
          if-no-files-found: ignore

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/ticktickpatch-release.keystore"

  publish:
    needs: build
    if: github.ref == 'refs/tags/v1.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TickTickPatch-release-1.1
          path: release-apk
      - name: Publish version 1.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-apk/TickTickPatch-1.1.apk \
            --verify-tag --title 'TickTickPatch 1.1' --notes-file xposed/RELEASE_NOTES.md
