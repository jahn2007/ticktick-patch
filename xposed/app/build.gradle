plugins {
    id 'com.android.application'
}

def releaseStore = providers.environmentVariable('SIGNING_STORE_FILE').orNull

android {
    namespace 'io.github.ticktickpatch'
    // libxposed 102.0.0's published AAR requires minCompileSdk=37.
    compileSdk 37
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.ticktickpatch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // Keep the entry class and META-INF registration easy to inspect.
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
